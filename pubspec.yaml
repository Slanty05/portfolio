name: portfolio
description: "A scalable Flutter portfolio platform built using Clean Architecture, Riverpod state management, and Firebase backend services."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.4.6
  firebase_storage: ^12.3.6
  firebase_auth: ^5.3.4

  # Animation
  flutter_animate: ^4.5.0

  # Localization
  intl: ^0.20.2

  # Utils
  equatable: ^2.0.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/cv/
    - assets/fonts/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/DM_Sans,Lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/DM_Sans,Lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DM_Sans,Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/DM_Sans,Lato/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/DM_Sans,Lato/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/DM_Sans,Lato/Lato-Thin.ttf
          weight: 100
