name: Deploy to Firebase Hosting (Production)

# Trigger on push to production branch
on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
          
      # 3. Get Flutter dependencies
      - name: Install dependencies
        run: flutter pub get
        
      # 4. Build Flutter web app
      - name: Build Flutter web app
        run: |
          if (Test-Path "scripts\build-web.ps1") {
            & scripts\build-web.ps1
          } else {
            flutter build web --base-href "https://portfolio-8ed95.web.app/"
            # Fallback: copy favicon manually
            Copy-Item "web/favicon.svg" "build/web/favicon.svg" -Force
          }
          
      # 5. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: portfolio-8ed95
          
      # 6. Notify deployment success
      - name: Deployment Success
        run: |
          echo "🎉 Successfully deployed to Firebase Hosting!"
          echo "🌐 Live URL: https://portfolio-8ed95.web.app"
